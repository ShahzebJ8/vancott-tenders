name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed, so Gradle is installed directly.
      # This also means there is no wrapper JAR in the repo to keep updated.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK by date
        id: name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/vancott-tenders-$(date -u '+%Y%m%d').apk"
          echo "file=out/vancott-tenders-$(date -u '+%Y%m%d').apk" >> "$GITHUB_OUTPUT"

      # Download it from the run's "Artifacts" section, or from Releases below.
      - uses: actions/upload-artifact@v4
        with:
          name: vancott-tenders-apk
          path: out/*.apk
          retention-days: 90

      # A rolling release so there is always one stable link to send staff.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VANCOTT Tenders — latest build
          body: |
            Install this on Android. You will need to allow
            "Install unknown apps" for your browser or file manager the first time.
          files: out/*.apk
          make_latest: true
